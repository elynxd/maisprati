<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fetch Movies</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: antiquewhite;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #searchForm {
            display: block;
            flex-direction: row;
            align-content: center;
            justify-content: center;
            gap: 1rem;
        }

        #searchInput {
            width: 300px;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        button {
            padding: 0.5rem 1rem;
            background-color: #743fee;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .movieResults {
            display: grid;
            grid-template-columns: auto auto auto auto;
            flex-wrap: wrap;
            flex-direction: row;
            grid-gap: 1rem;
            padding: 2rem;
        }
    </style>
    <body>
        <h1>Fetch Movies</h1>
        <form id="searchForm">
            <input
                type="text"
                id="searchInput"
                placeholder="Search for a movie..."
            />
            <button type="submit">Search</button>
        </form>
        <div class="movieResults" id="movieResults"></div>
    </body>
    <script>
        document
            .getElementById("searchForm")
            .addEventListener("submit", function (event) {
                event.preventDefault();
                const query = document.getElementById("searchInput").value;
                fetchMovies(query);
            });

        async function fetchMovies(query) {
            const apiKey = "cc6eb4b4"; // Replace with your actual API key
            const url = `https://www.omdbapi.com/?s=${encodeURIComponent(
                query
            )}&apikey=${apiKey}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                displayMovies(data.Search);
            } catch (error) {
                console.error("Error fetching movies:", error);
            }
        }

        function displayMovies(movies) {
            const movieResults = document.getElementById("movieResults");
            movieResults.innerHTML = "";

            if (!movies) {
                movieResults.innerHTML = "<p>No movies found.</p>";
                return;
            }

            movies.forEach((movie) => {
                const movieDiv = document.createElement("div");
                movieDiv.classList.add("movie");
                movieDiv.style = `
                display: flex; 
                flex-direction: column;
                width: 240px;
                border: 1px solid #000; 
                border-radius: 8px;`;

                const poster = document.createElement("img");
                poster.src =
                    movie.Poster !== "N/A" ? movie.Poster : "placeholder.jpg"; // Use a placeholder image if no poster is available
                poster.alt = `${movie.Title} Poster`;

                const title = document.createElement("h2");
                title.textContent = movie.Title;

                const year = document.createElement("p");
                year.textContent = `Year: ${movie.Year}`;

                const movieDescription = document.createElement("description");
                movieDescription.textContent = `${movie.description}`;

                movieDiv.appendChild(poster);
                movieDiv.appendChild(title);
                movieDiv.appendChild(year);

                movieResults.appendChild(movieDiv);
            });
        }
    </script>
</html>
