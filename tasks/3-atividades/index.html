<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lista de exercicio 3</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />

    <body>
        <header>

            <h2>Esta é uma página de exemplo.</h2>
            <nav class="nav">
                <button class="nav-toggle">

                <ul class="nav-menu">
                    <li><a href="#mission">Missão</a></li>
                    <li><a href="#vision">Visão</a></li>
                    <li><a href="#grid">Imagens</a></li>
                </ul>
            </nav>
        </header>
        <main class="container">
            <section id="mission">

                <p>

            <section id="vision">
                <h2>Visão:</h2>

                <div class="image-container">

                <div class="image-container">

            </div>
        </main>

        <footer>
            <p id="important">Eliandro 2025 - Copyright.</p>
        </footer>
    </body>
    <script>
        const navToggle = document.querySelector(".nav-toggle");
        const navMenu = document.querySelector(".nav-menu");

        navToggle.addEventListener("click", () => {
            navMenu.classList.toggle("nav-menu_visible");
            navToggle.setAttribute(
                "aria-expanded",
                navMenu.classList.contains("nav-menu_visible")
            );
        });

    </script>
</html>
